name: Setup Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-setup
  cancel-in-progress: false

jobs:
  setup:
    name: Create project, deploy and attach docs.majdata.net
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'majdata-docs' }}
      CLOUDFLARE_PAGES_DOMAIN: docs.majdata.net
      CLOUDFLARE_ZONE_NAME: majdata.net
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm build

      - name: Create Pages project, deploy and attach custom domain
        run: bash scripts/setup-cloudflare-pages.sh
